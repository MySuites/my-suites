name: MyHealth
options:
  bundleIdPrefix: com.mysuite
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en

packages:
  MyHealthKit:
    path: Packages/MyHealthKit

settings:
  base:
    DEVELOPMENT_TEAM: YGZKAF6C6H
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MyHealth:
    type: application
    platform: iOS
    sources:
      - path: MyHealth
    dependencies:
      - package: MyHealthKit
      - target: MyHealthWidgets
        embed: true
        codeSignOnCopy: true
      - target: MyHealth Watch App
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysuite.myhealth
        PRODUCT_NAME: MyHealth
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: MyHealth/MyHealth.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: MyHealth/Info.plist
      properties:
        CFBundleDisplayName: MyHealth
        UIUserInterfaceStyle: Automatic
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "MyHealth reads your health data to sync workouts and body weight."
        NSHealthUpdateUsageDescription: "MyHealth saves your workout and body weight data to Apple Health."
        NSCameraUsageDescription: "MyHealth uses your camera to let you attach photos to workouts and exercises."
        NSMicrophoneUsageDescription: "MyHealth uses your microphone for video recording."
        NSPhotoLibraryUsageDescription: "MyHealth uses your photo library to let you select and save progress pictures."
        NSPhotoLibraryAddUsageDescription: "MyHealth uses your photo library to let you save progress pictures."
        NSLocationWhenInUseUsageDescription: "MyHealth uses your location to track outdoor workouts like running and cycling."

  MyHealth Watch App:
    type: application
    platform: watchOS
    sources:
      - path: "MyHealth Watch App"
    dependencies:
      - package: MyHealthKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysuite.myhealth.watchkitapp
        PRODUCT_NAME: MyHealth Watch App
        SDKROOT: watchos
        SKIP_INSTALL: NO
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    info:
      path: "MyHealth Watch App/Info.plist"
      properties:
        CFBundleDisplayName: MyHealth
        UIUserInterfaceStyle: Automatic
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.mysuite.myhealth
        NSHealthShareUsageDescription: "MyHealth reads your health data to sync workouts."
        NSHealthUpdateUsageDescription: "MyHealth saves your workout data to Apple Health."

  MyHealthWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MyHealthWidgets
    dependencies:
      - package: MyHealthKit
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysuite.myhealth.widgets
        PRODUCT_NAME: MyHealthWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: MyHealthWidgets/Info.plist
      properties:
        CFBundleDisplayName: MyHealthWidgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  MyHealth:
    build:
      targets:
        MyHealth: all
    run:
      config: Debug
